# opncafyr documentation website (Jekyll + Just the Docs), published to GitHub Pages by
# .github/workflows/docs.yml. Local preview: ./preview.sh (see README.md in this folder).
title: opncafyr
description: >-
  A local, per-user workspace for noncompartmental analysis: clean a concentration file,
  run one analyte at a time in opnca-r, and publish completed runs to a Word report or a
  PowerPoint deck. Research use only.
url: https://jprybylski.github.io
# The project-site path. The Pages workflow passes the real one with --baseurl.
baseurl: /opncafyr
repository: jprybylski/opncafyr

theme: just-the-docs
color_scheme: opncafyr

defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 4
  preview_words_after: 8
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
enable_copy_code_button: true

aux_links:
  GitHub: https://github.com/jprybylski/opncafyr
aux_links_new_tab: false

nav_external_links: []

footer_content: >-
  Research use only. opncafyr has not been validated for clinical or regulatory
  decisions. Screenshots and examples use a made-up practice file.

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Careful
    color: yellow
  research:
    title: Research use only
    color: yellow
  expect:
    title: What you should see
    color: green
  fix:
    title: If something goes wrong
    color: red

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - preview.sh
  - .jekyll-cache

# The theme still uses Sass @import; keep the build log readable.
sass:
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]
