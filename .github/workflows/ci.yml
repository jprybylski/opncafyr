name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Check runtime pins (structure only)
        run: uv run python scripts/verify_pins.py
      - name: Check the tools environment lock is current
        run: uv lock --locked --project runtime/python/tools
      - name: Tests
        run: uv run pytest -v

  # #49: the home page in headless Chromium (render, origin, keyboard walk, axe). No R and
  # no child apps.
  ui:
    name: home page UI (Ubuntu, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment with the ui group
        run: uv sync --locked --group ui
      - name: Install Chromium for Playwright
        run: uv run --group ui playwright install --with-deps chromium
      - name: UI checks
        run: uv run --group ui pytest -m ui tests/ui -v

  # #16: opnca-r and deckifyr from their pinned releases behind the /apps/<tool>/ proxy.
  # macOS 15, the supported minimum (ADR 0003). opnca-r is private:
  # without the OPNCA_R_RELEASE_TOKEN secret its half is skipped with a warning.
  integration-proxy:
    name: proxy harness (macOS 15 arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked environment with the integration group
        run: uv sync --locked --group integration
      - name: Install Chromium for Playwright
        run: uv run --group integration playwright install chromium
      - name: Read pins
        run: |
          uv run --group integration python - >> "$GITHUB_ENV" <<'PY'
          import tomllib
          p = tomllib.load(open("runtime/pins.toml", "rb"))
          print(f"R_VERSION={p['r']['version']}")
          print(f"OPNCA_VERSION={p['packages']['opnca-r']['version']}")
          print(f"DECKIFYR_VERSION={p['packages']['deckifyr']['version']}")
          print(f"DECKIFYR_WHEEL={p['packages']['deckifyr']['wheel']}")
          PY
      - name: Check for the opnca-r release token
        id: opnca
        env:
          TOKEN: ${{ secrets.OPNCA_R_RELEASE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=opnca-r skipped::OPNCA_R_RELEASE_TOKEN is not set, so the opnca-r half of the proxy harness did not run. Add a read-only token for mantra-opnca/opnca-r as a repository secret."
          fi
      - uses: r-lib/actions/setup-r@v2
        if: steps.opnca.outputs.enabled == 'true'
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true
      - name: Install opnca-r's server packages into the private library
        if: steps.opnca.outputs.enabled == 'true'
        run: |
          mkdir -p rt/rlib
          Rscript -e 'install.packages(c("plumber2", "httpuv", "reqres", "jsonlite", "processx", "R6"), lib = "rt/rlib")'
      - name: Download and verify opnca-r (selected by manifest fields)
        if: steps.opnca.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPNCA_R_RELEASE_TOKEN }}
        run: |
          mkdir -p dl/opnca
          gh release download "v$OPNCA_VERSION" -R mantra-opnca/opnca-r -p manifest.json -D dl/opnca
          asset=$(uv run --group integration python -m opncafyr.adapters.opnca.release select --pins runtime/pins.toml --manifest dl/opnca/manifest.json)
          gh release download "v$OPNCA_VERSION" -R mantra-opnca/opnca-r -p "$asset" -D dl/opnca
          uv run --group integration python -m opncafyr.adapters.opnca.release verify --pins runtime/pins.toml --manifest dl/opnca/manifest.json --asset "dl/opnca/$asset"
      - name: Download the deckifyr wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$DECKIFYR_VERSION" -R jprybylski/deckifyr -p "$DECKIFYR_WHEEL" -D dl/deckifyr
      - name: Build the runtime record
        run: |
          args=(--out rt --deckifyr-wheel "dl/deckifyr/$DECKIFYR_WHEEL")
          if [ "${{ steps.opnca.outputs.enabled }}" = "true" ]; then args+=(--opnca-dir dl/opnca); fi
          echo "OPNCAFYR_RUNTIME_FILE=$(uv run --group integration python tests/integration/proxy/prepare_runtime.py "${args[@]}")" >> "$GITHUB_ENV"
      - name: Proxy harness and R-backed workflow tests
        run: uv run --group integration pytest -m integration tests/integration -rs

  # #44: the whole stack installs from local files and runs with the network cut. The
  # online phase fetches every pinned file (runtime/pins.toml [ci.linux-x86_64], the R
  # lock, both uv locks); the offline phase runs in its own network namespace under
  # strace, and any connection attempt that leaves the machine fails the job
  # (docs/offline.md). opnca-r is private: without OPNCA_R_RELEASE_TOKEN its build and
  # calculation are skipped with a warning.
  offline:
    name: offline install and run (Ubuntu 24.04, network blocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read pins
        run: |
          python3 - >> "$GITHUB_ENV" <<'PY'
          import tomllib
          p = tomllib.load(open("runtime/pins.toml", "rb"))
          print(f"UV_VERSION={p['uv']['version']}")
          print(f"OPNCA_VERSION={p['packages']['opnca-r']['version']}")
          PY
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check for the opnca-r release token
        id: opnca
        env:
          TOKEN: ${{ secrets.OPNCA_R_RELEASE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=opnca-r skipped::OPNCA_R_RELEASE_TOKEN is not set, so the offline job did not build opnca-r or run the calculation."
          fi
      - name: Download the opnca-r vendored source tarball
        if: steps.opnca.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPNCA_R_RELEASE_TOKEN }}
        run: |
          gh release download "v$OPNCA_VERSION" -R mantra-opnca/opnca-r \
            -p "opnca_${OPNCA_VERSION}-vendored.tar.gz" -D dl
      - name: Fetch and verify every pinned asset (online phase)
        run: |
          args=(--out assets)
          if [ "${{ steps.opnca.outputs.enabled }}" = "true" ]; then
            args+=(--opnca-vendored "dl/opnca_${OPNCA_VERSION}-vendored.tar.gz")
          fi
          python3 scripts/offline/fetch.py "${args[@]}"
      - name: Install the pinned R and the system libraries (online prerequisites)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ./assets/runtime/r-4.6.2_1_amd64.deb strace \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev libsodium-dev \
            libfontconfig1-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev libcairo2-dev libuv1-dev
      - name: Offline phase (network namespace, traced)
        run: |
          sudo -E unshare --net sh -c '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups \
              env HOME="$3" PATH=/usr/bin:/bin JOBS=4 \
              strace -f -qq -s 200 -e trace=%network,%process -o trace.txt \
              bash scripts/offline/offline_phase.sh assets work
          ' sh "$(id -u)" "$(id -g)" "$HOME"
      - name: No connection attempts left the machine
        if: always()
        run: |
          python3 scripts/offline/check_trace.py trace.txt \
            --allow scripts/offline/allowed_attempts.toml --json work/results/trace-report.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-results
          path: |
            work/results/
            assets/fetch-manifest.json
          if-no-files-found: ignore
