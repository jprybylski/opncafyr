[project]
name = "opncafyr"
version = "0.0.1"
description = "Local, per-user workspace launcher for opnca-r NCA runs and deckifyr/quartifyr reporting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "John Prybylski" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "psutil>=6.0",
    "blake3>=1.0",
]

[project.scripts]
opncafyr = "opncafyr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]
integration = [
    "playwright>=1.48",
]
ui = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opncafyr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The proxy harness (#16) needs installed tools; run it with `pytest -m integration`.
# The browser checks of the home page (#49) need Chromium; run them with `pytest -m ui`.
addopts = "-ra -m 'not integration and not ui'"
markers = [
    "integration: needs the pinned child apps (see docs/spikes/basepath.md)",
    "ui: home page checks in headless Chromium (uv sync --group ui)",
]
# Dump every thread's stack if one test runs longer than this (diagnoses hangs in CI).
faulthandler_timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
