# Exact versions and checksums for everything the installer provisions.
# Filled in during Gate 0 (see docs/plan.md). Every artifact needs a sha256 per platform.
# Nothing here is used yet; values marked "TBD" are open decisions.

schema_version = 1

[platforms]
# Decided in ADR 0003 (#1): Windows 11 x86_64, macOS arm64/x86_64, R 4.6.2. No arm64
# Windows, no Windows 10, no native Linux (Linux only through the container, #42).
supported = ["windows-x86_64", "macos-arm64", "macos-x86_64"]
windows_min = "11"
macos_min = "15"           # opnca-r 0.2.7 binaries target macOS 15; 13 once opnca-r#45 lands

[uv]
version = "TBD"

[python]
version = "3.13"           # matches .python-version; uv-managed, app-owned

[r]
version = "4.6.2"          # ADR 0003. Installed with `rig add --without-path --no-default`,
                           # per-user. opnca-r 0.2.7 binaries are built on R 4.6.2.
renv_lock = "runtime/renv.lock"   # created in Gate 0

[quarto]
version = "TBD"

[rust]
# Only for the repair/exception source build of the vendored tarball (ADR 0004).
toolchain = "TBD (>= 1.87.0; Windows: x86_64-pc-windows-gnu + Rtools)"
# 1.87.0 is opnca-r's declared MSRV but upstream CI only builds on stable (opnca-r #43):
# pin a toolchain we test ourselves. Builds use the -vendored tarball (no crates.io).

[packages.opnca-r]
version = "0.2.7"
source = "github:mantra-opnca/opnca-r"
# v0.2.7 (2026-11-06, commit 0b547d0) adds the launcher API token, --no-overwrite and
# --require-blq-rules (#40-#43). Select assets by manifest.json fields (kind/platform/arch/
# r_minor), never by file name. manifest.json (schema_version 1) is not in SHA256SUMS,
# so pin its hash here.
manifest_sha256 = "4e3616cddaad5e3f9d9da3b3781c66548e072363ed794af4a4b6b77b849ddd2e"
sha256sums_sha256 = "9d6d429ad999c4c88fff1a5d621a932f30e1b36c513465b66420cc9f3cc55700"
source_commit = "0b547d05793e1bdbe7a00eac78b87fdcb58f80fa"
r_minor = "4.6"            # binaries built on R 4.6.2

[packages.opnca-r.assets]
"opnca_0.2.7_R4.6_macos-arm64.tgz" = "1766cd2152f2c8398c5b57e6084e2624cb30167046ec2a0cdec4430a18b15cb5"
"opnca_0.2.7_R4.6_macos-x86_64.tgz" = "8aabe38f1ce5069a87d80a08504904d3745b35673a0b8c302bad9775c290a46d"
"opnca_0.2.7_R4.6_windows-x86_64.zip" = "a9cae57fe894f7d7c7e6e831023bd0b7346ab45ba7bd1693298822f5fde3fcb8"
"opnca_0.2.7-vendored.tar.gz" = "4a6f3fc9306833a98c260eb9b5ca18c660b36625cbb2b63cd617c067113a892c"  # offline source fallback

[packages.deckifyr]
version = "0.3.5"
source = "github:jprybylski/deckifyr"
extras = ["web", "preview"]
# Install the wheel; R users can install the R tarball. The wheel's dependencies are
# lower bounds only, so the offline wheelhouse pins the exact transitive versions (#36).
# v0.3.5 (2026-11-06, tag e35a4fa) adds the request guard, trust policy and atomic builds
# (#88-#91). Its release workflow no longer re-tags or replaces a published release.
wheel = "deckifyr-0.3.5-py3-none-any.whl"
wheel_sha256 = "0faea61387b0d7a8d8d698807bd07f96007e43a6ebee07af9f900768e17c6186"
sdist_sha256 = "19030dba30dcf9192ac1b8db5b42adea280d22d3e21e663e858f29800c2de8b3"
r_tarball_sha256 = "d29e58b6a40dfb89a3eb970078c61c2cab41b7059a415e5c99be3012f5c12b2c"
sha256sums_sha256 = "18ed32bf7bb5392f89f23629f5a942b711488bb264af00628c6c508c53f1d83b"

[packages.quartifyr]
version = "0.3.2"
source = "github:jprybylski/quartifyr"
# v0.3.2 (2026-11-05) is the first real release of #69-#72 and #75-#78. Tag v0.3.2 points
# at 5f3b0f5. quartifyr's release workflow may refresh a release (re-tag, replace the
# tarball) within 24 hours of publishing, by design. Pin only releases older than that;
# 0.3.2 was published 2026-11-05T22:52Z, so re-verify these hashes after 2026-11-06T22:52Z.
commit = "5f3b0f51b31d46b42f36d6cdd265722e6215c22f"
tarball_sha256 = "cb29f01bbf417dd494c510c85b5635d8f1a16350ce39a96ca04b4ee2cb2d3a03"
sha256sums_sha256 = "bde43fd33280a42537f8ece25d5d34b6edde93d2a36fa9223475340f1b8d08ae"

[packages.reportifyr]
version = "TBD"            # external (A2-ai); pinned, not modified

[optional.libreoffice]
status = "TBD"             # bundle per-user or mark previews/field recalculation unavailable
