# Exact versions and checksums for everything the installer provisions (#5).
#
# One source of truth for online install, internal mirrors and offline bundles (#36): each
# file has a source URL and a SHA-256, so a bundle can be assembled from this file alone.
# `scripts/verify_pins.py` checks the structure; `--network` downloads and hashes every
# URL. docs/dependency-graph.md says which component needs what.
#
# Conventions:
# - Runtimes: [<name>.assets.<platform>] with url + sha256 for every platform in
#   [platforms].supported, unless the section lists `platforms`.
# - Release packages: release_url + [packages.<name>.assets] file name -> sha256.
# - Nothing names a moving ref (main, latest, HEAD); r-universe is never used.

schema_version = 1

[platforms]
# Decided in ADR 0003 (#1): Windows 11 x86_64, macOS arm64/x86_64, R 4.6.2. No arm64
# Windows, no Windows 10, no native Linux (Linux only through the container, #42).
supported = ["windows-x86_64", "macos-arm64", "macos-x86_64"]
windows_min = "11"
macos_min = "15"           # opnca-r 0.2.7 binaries target macOS 15; 13 once opnca-r#45 lands

