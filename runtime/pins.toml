# --- Container image (#42) ---------------------------------------------------------------
# The image's own pins. Everything else in it comes from [ci.linux-*], [packages.*] and
# the R and Python locks. scripts/container_args.py turns this into build arguments.

[container]
license = "Ubuntu: mixed (GPL, LGPL, MIT, BSD and others)"
# Docker Hub's multi-arch index for ubuntu:24.04, pinned by digest (never by tag alone).
base_image = "docker.io/library/ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852"
# Ubuntu packages: exact versions per architecture and build stage, in
# container/apt/lock-<platform>-<stage>.txt, generated by scripts/container/lock_apt.sh and
# installed verbatim (anything else apt would add fails the build). snapshot.ubuntu.com
# can't be used: it is https-only (the bare base image has no CA bundle) and has no public
# ports (arm64) archive. When a locked version leaves the archive, the build fails until
# the locks are regenerated, which is a deliberate re-pin.
apt_locks = "container/apt"
image = "ghcr.io/jprybylski/opncafyr"   # private package (#43 decides any wider release)

[container.libreoffice]
# The -full image's LibreOffice: TDF's Linux .deb set, the same version as the desktop
# [optional.libreoffice]. MPL-2.0.
license = "MPL-2.0"
version = "26.2.7.1"
platforms = ["linux-x86_64", "linux-aarch64"]

[container.libreoffice.assets.linux-x86_64]
url = "https://downloadarchive.documentfoundation.org/libreoffice/old/26.2.7.1/deb/x86_64/LibreOffice_26.2.7.1_Linux_x86-64_deb.tar.gz"
sha256 = "7cc840bd089f4779636cb2340f33786e71ce66669fdfbe36fe5c7322edc186ee"

