# Exact versions and checksums for everything the installer provisions.
# Filled in during Gate 0 (see docs/plan.md). Every artifact needs a sha256 per platform.
# Nothing here is used yet; values marked "TBD" are open decisions.

schema_version = 1

[platforms]
# Decided in the Gate 0 platform-matrix decision issue.
supported = ["TBD: windows-x86_64", "TBD: macos-arm64", "TBD: macos-x86_64"]

[uv]
version = "TBD"

[python]
version = "3.13"           # matches .python-version; uv-managed, app-owned

[r]
version = "TBD: 4.6.x"      # installed with `rig add --without-path --no-default`, per-user.
                           # 4.6 because opnca-r 0.2.6 binaries are built for R 4.6.
renv_lock = "runtime/renv.lock"   # created in Gate 0

[quarto]
version = "TBD"

[rust]
# Only for source-build fallback when no platform binary exists for opnca-r.
toolchain = "TBD (>= 1.87.0; Windows: x86_64-pc-windows-gnu + Rtools)"
# 1.87.0 is opnca-r's declared MSRV but upstream CI only builds on stable (opnca-r #43):
# pin a toolchain we test ourselves. Builds use the -vendored tarball (no crates.io).

[packages.opnca-r]
version = "0.2.6"
source = "github:mantra-opnca/opnca-r"
# Select assets by manifest.json fields (kind/platform/arch/r_minor), never by file name:
# the Windows binary is opnca_<ver>.zip, macOS is opnca_<ver>_R4.6_macos-<arch>.tgz.
manifest_sha256 = "cc2db122e580ad332526848435e5741ce94da0b06db3e5d20ab5b1f313c11f63"
r_minor = "4.6"

[packages.opnca-r.assets]
"opnca_0.2.6_R4.6_macos-arm64.tgz" = "e7edd15a1510a8bb588980e62cfef62c8d160e255a8e9364f0dab31bff2dabeb"
"opnca_0.2.6_R4.6_macos-x86_64.tgz" = "cc1d1e5fcd01ffedc84988b758d96d1b9423f23dcf3369db4993a98a034b5ceb"
"opnca_0.2.6.zip" = "a61322db8bfab06da2f35a8a8fdc8728d07f5f5b3c384d41375a030a024169b0"   # windows-x86_64, R 4.6
"opnca_0.2.6-vendored.tar.gz" = "472f8bdf8b15ef25bfccbbd12c5a60c716a73d4b327ad887d6592f4c209e5184"  # offline source fallback

[packages.deckifyr]
version = "0.3.4"
source = "github:jprybylski/deckifyr"
extras = ["web", "preview"]
# Install the wheel; R users can install the R tarball. The wheel's dependencies are
# lower bounds only, so the offline wheelhouse pins the exact transitive versions (#36).
wheel = "deckifyr-0.3.4-py3-none-any.whl"
wheel_sha256 = "8e280a5a52b6789ba26b7cc2565d399119c56e2f6ef21b440e1520a8a3a2751c"
sdist_sha256 = "13467e96b531257088beb53519d53b12884c60c513cef58f4a8010d60a206fe6"
r_tarball_sha256 = "6120deb1c72775a66ac757b6f3c4917a5f840af4d1ca67ddc6c78410c2600322"
sha256sums_sha256 = "b67d971ee306a747f7a26fb2bd710fd53b401d8f6b26c4b30ccc485553976ed6"

[packages.quartifyr]
version = "0.3.2"
source = "github:jprybylski/quartifyr"
# v0.3.2 (2026-11-05) is the first real release of #69-#72 and #75-#78. Tag v0.3.2 points
# at 5f3b0f5. quartifyr's release workflow may refresh a release (re-tag, replace the
# tarball) within 24 hours of publishing, by design. Pin only releases older than that;
# 0.3.2 was published 2026-11-05T22:52Z, so re-verify these hashes after 2026-11-06T22:52Z.
commit = "5f3b0f51b31d46b42f36d6cdd265722e6215c22f"
tarball_sha256 = "cb29f01bbf417dd494c510c85b5635d8f1a16350ce39a96ca04b4ee2cb2d3a03"
sha256sums_sha256 = "bde43fd33280a42537f8ece25d5d34b6edde93d2a36fa9223475340f1b8d08ae"

[packages.reportifyr]
version = "TBD"            # external (A2-ai); pinned, not modified

[optional.libreoffice]
status = "TBD"             # bundle per-user or mark previews/field recalculation unavailable
