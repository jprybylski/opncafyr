[r_packages]
# The app-private library. renv.lock is generated by scripts/lock_r.R against a dated
# Posit Package Manager snapshot; binaries.toml (scripts/pin_r_binaries.py) pins each
# package's binary per platform plus its source tarball. The installer fetches those
# files into a local CRAN-like repository and restores with repos pointing only there,
# so online, mirror and offline installs take the same path. On macOS the installer
# uses base R's install.packages() from that repository and checks every version against
# renv.lock: renv::restore() runs `R CMD config CC`, which needs the Command Line Tools
# (#7). The repository's source index lists every package (#6). The packages in
# [packages.*] come from the renv cellar. Exception: P3M's macOS gdtools links XQuartz
# (/opt/X11, admin install), so macOS gdtools comes from CRAN's self-contained build
# (`origin = "cran"` in binaries.toml).
lockfile = "runtime/r/renv.lock"
binaries = "runtime/r/binaries.toml"
repository = "https://packagemanager.posit.co/cran/2026-11-06"
renv = "1.3.1"            # must match renv in renv.lock

