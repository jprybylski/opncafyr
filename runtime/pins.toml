# Exact versions and checksums for everything the installer provisions (#5).
#
# One source of truth for online install, internal mirrors and offline bundles (#36): each
# file has a source URL and a SHA-256, so a bundle can be assembled from this file alone.
# `scripts/verify_pins.py` checks the structure; `--network` downloads and hashes every
# URL. docs/dependency-graph.md says which component needs what.
#
# Conventions:
# - Runtimes: [<name>.assets.<platform>] with url + sha256 for every platform in
#   [platforms].supported, unless the section lists `platforms`.
# - Release packages: release_url + [packages.<name>.assets] file name -> sha256.
# - Optional components: [optional.<name>], installed only on request, or by default with
#   `default = true` (then a failure leaves the component out instead of failing).
# - Nothing names a moving ref (main, latest, HEAD); r-universe is never used.

schema_version = 1

[platforms]
# Decided in ADR 0003 (#1): Windows 11 x86_64, macOS arm64/x86_64, R 4.6.2. No arm64
# Windows, no Windows 10. Native Linux (Ubuntu 24.04, x86_64 and aarch64) was added by the
# ADR 0003 amendment of #65; before that, Linux ran only through the container (#42).
supported = ["windows-x86_64", "macos-arm64", "macos-x86_64", "linux-x86_64", "linux-aarch64"]
# A supported platform whose opnca-r binary is not pinned yet. The pins check skips only that
# requirement for it, and the installer refuses it (unless told, for development, that
# opnca-r will be missing). Linux waits for opnca-r#61; remove a platform from this list in
# the commit that pins its opnca-r binary.
pending = ["linux-x86_64", "linux-aarch64"]
windows_min = "11"
linux_os = "ubuntu"        # /etc/os-release ID and VERSION_ID of the one supported Linux (#65)
linux_os_version = "24.04"
linux_glibc_min = "2.39"   # Posit's R and Posit's noble R binaries are built on Ubuntu 24.04
macos_min = "15"           # opnca-r 0.3.2 binaries need 13.0 (arm64) / 11.0 (x86_64); lowering
                           # this waits on Quarto, uv Python, wheel and CRAN-binary checks (ADR 0003, #1)

