[optional.git]
# Git for the optional version history (#56, gitneighbr adapter). The tools use this
# pinned, app-owned Git only, never one found on PATH. Installed by default, but optional:
# if it can't be fetched or unpacked the install still succeeds, the install record and
# report say so, and version history is unavailable (`--without-git` leaves it out).
# Source: GitHub Desktop's dugite-native: a portable Git build for every supported
# platform, a plain .tar.gz that unpacks per user with no installer or admin rights, from
# one source for both OSes (git-scm.com has no portable macOS build). The macOS build is not
# relocatable on its own (compiled exec path `/`): callers pass
# `--exec-path=<root>/libexec/git-core` (macOS) or `<root>/ucrt64/libexec/git-core`
# (Windows). Git is GPL-2.0-only; dugite-native's packaging is MIT, and the archives
# bundle Git LFS and Git Credential Manager (MIT) and curl, OpenSSL and others.
status = "optional"
default = true
version = "2.56.0"
release = "v2.56.0-2"      # dugite-native release tag, published 2026-10-26
license = "GPL-2.0-only AND MIT"

