schema_version: "1.0"
id: deckifyr
version: 1
display_name: deckifyr
runtime: python
capabilities: [edit_deck, validate_deck, build_deck, preview_deck]
executables: [deckifyr_python]
health: {kind: python_import, executable: deckifyr_python, target: deckifyr}
web_app:
  route: /apps/deckifyr/
  readiness: /api/health
  max_body_bytes: 67108864
# The deck workflow (workflows/nca/publish/deck.py) reads these time limits (#33).
jobs:
  validate_deck: {input_schema: publication-v1, output_schema: preflight-v1, timeout_s: 300}
  build_deck: {input_schema: publication-v1, output_schema: publish-build-v1, timeout_s: 1200}
optional_requirements:
  - name: libreoffice
    executable: soffice
    capabilities: [preview_deck]
    message: "Slide previews unavailable: LibreOffice is not installed."
  - name: quarto
    executable: quarto
    message: "Quarto elements unavailable: Quarto is not installed."
